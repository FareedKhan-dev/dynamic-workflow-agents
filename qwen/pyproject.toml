[project]
name = "dynamic-workflows-qwen"
version = "0.1.0"
description = "A course notebook: a lead agent writes its own plan, a runtime runs it in phases, and experiments test whether any of it helps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "jsonschema>=4.22",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[dependency-groups]
lab = ["jupyterlab>=4.2"]

[tool.uv]
package = false
